<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'none'">
  <title>Respiro</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="titlebar" id="titlebar">
    <span class="titlebar-title">Respiro</span>
    <div class="titlebar-actions">
      <button class="sim-pill" id="sim-pill" type="button" hidden>Modo simular</button>
      <button class="icon-button" id="btn-history" type="button" aria-label="Histórico" data-tip="Histórico  ⌘Y"></button>
      <button class="icon-button" id="btn-rescan" type="button" aria-label="Reanalisar" data-tip="Reanalisar  ⌘R"></button>
      <button class="icon-button" id="btn-prefs" type="button" aria-label="Ajustes" data-tip="Ajustes  ⌘,"></button>
    </div>
    <div class="progress" id="progress" role="progressbar" aria-label="Progresso da análise" aria-valuemin="0"><span></span></div>
  </header>

  <main class="content" id="content">
    <section class="disk" aria-labelledby="disk-summary">
      <p class="disk-name" id="disk-name"></p>
      <h1 class="disk-summary" id="disk-summary"><span class="num" id="disk-free"></span> livres<span class="of" id="disk-total"></span></h1>
      <div class="bar" id="bar" role="img"></div>
      <ul class="legend" id="legend"></ul>
    </section>

    <section class="safe" aria-labelledby="safe-label">
      <div>
        <p class="safe-label" id="safe-label">Pode ser liberado com segurança</p>
        <p class="safe-value num" id="safe-value"></p>
        <p class="safe-note" id="safe-note"></p>
      </div>
      <button class="button primary" id="btn-free" type="button" hidden>Revisar e liberar…</button>
    </section>

    <ul class="group" id="categories" aria-label="Categorias"></ul>
    <p class="footer" id="footer"></p>
  </main>

  <dialog class="sheet" id="sheet"></dialog>
  <p class="sr-only" id="announce" aria-live="polite"></p>
</body>
</html>
