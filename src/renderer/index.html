<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'none'">
  <title>Respiro</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="titlebar" id="titlebar">
    <span class="titlebar-title">Respiro</span>
    <div class="titlebar-actions">
      <div class="progress" id="progress" role="progressbar" data-i18n-attr="aria-label:progress.label" aria-valuemin="0"></div>
      <button class="sim-pill clean-pill" id="clean-pill" type="button" hidden><span></span></button>
      <button class="sim-pill" id="sim-pill" type="button" hidden><span data-i18n="titlebar.simPill"></span></button>
      <button class="icon-button" id="btn-explore" type="button" data-i18n-attr="aria-label:titlebar.explore,data-tip:titlebar.exploreTip"></button>
      <button class="icon-button" id="btn-history" type="button" data-i18n-attr="aria-label:titlebar.history,data-tip:titlebar.historyTip"></button>
      <button class="icon-button" id="btn-rescan" type="button" data-i18n-attr="aria-label:titlebar.rescan,data-tip:titlebar.rescanTip"></button>
      <button class="icon-button" id="btn-prefs" type="button" data-i18n-attr="aria-label:titlebar.prefs,data-tip:titlebar.prefsTip"></button>
    </div>
  </header>

  <main class="content" id="content">
    <section class="disk" aria-labelledby="disk-summary">
      <p class="disk-name" id="disk-name"></p>
      <h1 class="disk-summary" id="disk-summary"><span class="num" id="disk-free"></span> <span data-i18n="disk.freeWord"></span><span class="of" id="disk-total"></span></h1>
      <div class="bar" id="bar" role="img"></div>
      <ul class="legend" id="legend"></ul>
    </section>

    <section class="safe" aria-labelledby="safe-label">
      <div class="safe-loader" id="safe-loader" hidden></div>
      <div id="safe-text">
        <p class="safe-label" id="safe-label" data-i18n="safe.label"></p>
        <p class="safe-value num" id="safe-value"></p>
        <p class="safe-note" id="safe-note"></p>
      </div>
      <button class="button primary" id="btn-free" type="button" hidden></button>
    </section>

    <ul class="group" id="categories" data-i18n-attr="aria-label:list.label"></ul>
    <p class="footer" id="footer"></p>
  </main>

  <dialog class="sheet" id="sheet"></dialog>
  <dialog class="welcome" id="welcome" aria-labelledby="welcome-title"></dialog>
  <dialog class="cleaning" id="cleaning" aria-labelledby="cleaning-title"></dialog>
  <dialog class="cleaning explore" id="explore" aria-labelledby="explore-title"></dialog>
  <p class="sr-only" id="announce" aria-live="polite"></p>
</body>
</html>
